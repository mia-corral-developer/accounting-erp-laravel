# Isolated test runner. Never touches the runtime stack (app/web/mysql/redis).
#
#   docker compose -f docker-compose.test.yml run --rm test
#   docker compose -f docker-compose.test.yml run --rm test \
#       php -d memory_limit=-1 vendor/bin/pest --filter TenantIsolationTest
#
# tests/ and phpunit.xml are bind-mounted because .dockerignore keeps them out
# of the build context (they must never ship in a prod image). Mounting them
# read-only also pins the suite to the exact working-tree checkout.
#
# WHY MySQL (not sqlite): phpunit.xml declares sqlite :memory:, but the codebase
# is NOT sqlite-compatible — ~26 tests throw MissingAttributeException because
# AppServiceProvider runs Model::shouldBeStrict(!isProduction()) and sqlite is
# missing columns that exist on MySQL. An EPHEMERAL MySQL (tmpfs volume, no
# persistence) gives real isolation from the runtime data AND a faithful schema.
services:
  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    image: accounting-erp-laravel:test
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: liberu_test
      DB_USERNAME: liberu
      DB_PASSWORD: secret
    volumes:
      - ./tests:/var/www/html/tests:ro
      - ./phpunit.xml:/var/www/html/phpunit.xml:ro

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: liberu_test
      MYSQL_USER: liberu
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    # tmpfs = the whole datadir lives in RAM and dies with the container:
    # the test DB can never leak into or read from the runtime database.
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 20