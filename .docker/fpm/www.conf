; PHP-FPM pool for the FPM runtime (replaces the Octane/RoadRunner worker).
; The master process runs as root (needed to setuid the workers); each worker
; runs as the unprivileged "octane" user so files it writes stay owned by it.
[global]
error_log = /dev/stderr
daemonize = no

[www]
user = octane
group = octane
listen = 0.0.0.0:9000

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

clear_env = no
catch_workers_output = yes
decorate_workers_output = no