[PHP]
post_max_size = 420M
upload_max_filesize = 400M
expose_php = 0
realpath_cache_size = 32M
realpath_cache_ttl = 720
memory_limit = 256M
max_input_time = 5
register_argc_argv = 0
date.timezone = UTC

[Opcache]
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.use_cwd = 0
opcache.save_comments = 1
opcache.max_file_size = 0
opcache.max_accelerated_files = 32531
opcache.validate_timestamps = 0
opcache.file_update_protection = 0
opcache.interned_strings_buffer = 16
opcache.enable_file_override = 1
; NOTE: opcache.file_cache was removed on purpose. It needs an existing,
; writable directory and aborts PHP startup if that directory is missing
; (this was the original Octane boot failure). PHP-FPM does not need it.

[JIT]
; JIT disabled on purpose: the tracing JIT segfaults php-fpm workers
; (zend_mm_heap corrupted / SIGSEGV, signal 11) on this stack
; (PHP 8.5 + Filament 5 + Livewire 4 + Spatie). OPcache bytecode caching
; stays enabled — JIT adds little for an I/O-bound accounting ERP.
opcache.jit_buffer_size = 0
opcache.jit = off
