services:
  # PHP-FPM application container. Single process (php-fpm), no supervisord,
  # no Octane/RoadRunner. Serves FastCGI on :9000 for the "web" container.
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
      args:
        PHP_VERSION: '8.5'
        USER_ID: '${WWWUSER:-1000}'
        GROUP_ID: '${WWWGROUP:-1000}'
    image: accounting-erp-laravel:app
    restart: unless-stopped
    environment:
      CONTAINER_MODE: http
      RUNNING_MIGRATIONS_AND_SEEDERS: '${RUNNING_MIGRATIONS_AND_SEEDERS:-false}'
      MODULES_CACHE: 'true'
      DB_CONNECTION: 'mysql'
      DB_HOST: mysql
      DB_PORT: '3306'
      DB_DATABASE: '${DB_DATABASE:-liberu}'
      DB_USERNAME: '${DB_USERNAME:-liberu}'
      DB_PASSWORD: '${DB_PASSWORD:-secret}'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
    env_file:
      - .env
    expose:
      - '9000'
    volumes:
      - storage:/var/www/html/storage/app
      - logs:/var/www/html/storage/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - appnet

  # nginx front-end. Owns the public port; serves static files from public/ and
  # proxies PHP to app:9000.
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    image: accounting-erp-laravel:web
    restart: unless-stopped
    ports:
      - '${APP_PORT:-8000}:80'
    depends_on:
      - app
    networks:
      - appnet

  reverb:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
      args:
        PHP_VERSION: '8.5'
    image: accounting-erp-laravel:app
    restart: unless-stopped
    environment:
      CONTAINER_MODE: reverb
      DB_CONNECTION: 'mysql'
      DB_HOST: mysql
      DB_PORT: '3306'
      DB_DATABASE: '${DB_DATABASE:-liberu}'
      DB_USERNAME: '${DB_USERNAME:-liberu}'
      DB_PASSWORD: '${DB_PASSWORD:-secret}'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
    env_file:
      - .env
    volumes:
      - storage:/var/www/html/storage/app
      - logs:/var/www/html/storage/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - appnet
    profiles:
      - reverb

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
      args:
        PHP_VERSION: '8.5'
    image: accounting-erp-laravel:app
    restart: unless-stopped
    environment:
      CONTAINER_MODE: worker
      WORKER_COMMAND: 'php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600'
      MODULES_CACHE: 'true'
      DB_CONNECTION: 'mysql'
      DB_HOST: mysql
      DB_PORT: '3306'
      DB_DATABASE: '${DB_DATABASE:-liberu}'
      DB_USERNAME: '${DB_USERNAME:-liberu}'
      DB_PASSWORD: '${DB_PASSWORD:-secret}'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
    env_file:
      - .env
    volumes:
      - storage:/var/www/html/storage/app
      - logs:/var/www/html/storage/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - appnet
    profiles:
      - worker

  mysql:
    image: mysql:8.0
    command: --innodb-buffer-pool-size=3G --innodb-buffer-pool-instances=3 --innodb-flush-method=O_DIRECT --innodb-io-capacity=2000 --max-connections=300
    ports:
      - '${FORWARD_DB_PORT:-3306}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD:-secret}'
      MYSQL_DATABASE: '${DB_DATABASE:-liberu}'
      MYSQL_USER: '${DB_USERNAME:-liberu}'
      MYSQL_PASSWORD: '${DB_PASSWORD:-secret}'
    volumes:
      - mysql:/var/lib/mysql
    networks:
      - appnet
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '${FORWARD_REDIS_PORT:-6379}:6379'
    volumes:
      - redis:/data
    networks:
      - appnet
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '${FORWARD_MAIL_PORT:-1025}:1025'
      - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
    networks:
      - appnet

networks:
  appnet:
    driver: bridge

volumes:
  mysql:
    driver: local
  redis:
    driver: local
  storage:
    driver: local
  logs:
    driver: local